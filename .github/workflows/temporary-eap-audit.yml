name: Temporary EAP audit runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-eap-audit.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fairbairn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eap-audit-runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install curl-cffi
      - run: python tools/eap_extract.py
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fairbairn-probe
          path: fairbairn_probe
          if-no-files-found: warn
# fairbairn probe trigger
