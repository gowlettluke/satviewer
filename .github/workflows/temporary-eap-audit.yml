name: Temporary EAP audit runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-eap-audit.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eap-audit-runner
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install curl-cffi
      - run: timeout 20m python tools/eap_extract.py --batch ${{ matrix.batch }} --batches 4
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eap-batch-${{ matrix.batch }}
          path: eap_batch_${{ matrix.batch }}
          if-no-files-found: warn
